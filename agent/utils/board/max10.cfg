# board/max10.cfg – конфигурация для MAX 10 (DE10-Lite) с USB-Blaster

# Интерфейс программатора
adapter driver usb_blaster
transport select jtag
# Если OpenOCD старый (до 0.11), можно раскомментировать:
# source [find interface/altera-usb-blaster.cfg]

# Скорость JTAG (5000 кГц = 5 МГц – стабильно для MAX 10)
adapter speed 5000

# Описание JTAG-цепи: один кристалл MAX 10 (10M50DA, DE10-Lite)
# Длина IR = 10, IDCODE = 0x031050DD (Altera TAP, проверен на этой плате)
jtag newtap max10 tap -irlen 10 -expected-id 0x031050DD

# Если у вас другой чип (например, 10M08 или 10M16) – уточните IDCODE,
# запустив openocd с этим конфигом без expected-id и посмотрев вывод.

# Цель (target) для SVF не требуется, но можно добавить для отладки:
# target create max10.cpu cortex_m -chain-position max10.tap

# Инициализацию делать здесь не будем – она будет вызвана из командной строки.