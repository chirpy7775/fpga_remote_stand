<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Remote stand{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --card: #ffffff;
            --line: #d8deea;
            --text: #1c2430;
            --muted: #687385;
            --accent: #3056d3;
            --ok: #146c43;
            --bad: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .shell {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .nav a {
            color: var(--text);
            text-decoration: none;
            margin-right: 12px;
        }
        .logout-btn {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            text-decoration: none;
        }
        .logout-btn:hover {
            text-decoration: underline;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
            margin-bottom: 16px;
        }
        h1, h2, h3 { margin-top: 0; }
        .muted { color: var(--muted); }
        .status {
            display: inline-block;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 14px;
            background: #eef2ff;
        }
        .status.completed { color: var(--ok); background: #ecfdf3; }
        .status.error { color: var(--bad); background: #fef3f2; }
        .status.running { color: #7a4d00; background: #fff8eb; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }
        input, button {
            font: inherit;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
        pre {
            margin: 0;
            padding: 16px;
            background: #101828;
            color: #e5ecf6;
            border-radius: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
        }
        .messages li {
            padding: 12px 14px;
            border-radius: 12px;
            background: #eef4ff;
            margin-bottom: 8px;
        }
        .stack > * + * {
            margin-top: 14px;
        }
        .grid {
            display: grid;
            gap: 16px;
        }
        @media (min-width: 860px) {
            .grid.two {
                grid-template-columns: 1fr 1.7fr;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="nav">
        <div><a href="{% url 'jobs:dashboard' %}"><strong>Remote stand</strong></a></div>
        <div>
            {% if request.user.is_authenticated %}
                <span class="muted">{{ request.user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
