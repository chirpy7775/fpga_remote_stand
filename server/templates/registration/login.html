{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <h1>Вход</h1>
    <form method="post" class="stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>
    <p class="muted">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    <p class="muted"><a href="{% url 'jobs:start' %}">Вернуться к выбору режима</a></p>
</div>
{% endblock %}
